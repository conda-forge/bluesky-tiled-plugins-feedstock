{% set name = "bluesky-tiled-plugins" %}
{% set version = "2.0.16" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/a3/6a/10553e18d644e8aac4af86583f448228a0a8cd6d5bc9ba8bae67b38f4f5f/bluesky_tiled_plugins-{{ version }}.tar.gz
  sha256: a6dbdcb76961e40d9b7ec3afe92df8e711beea0b2769527e690d3e79dfddd947

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - dask-core
    - event-model
    - httpx2
    - mongoquery
    - ndindex
    - numpy
    - pandas
    - pyarrow
    - pytz
    - tiled-client >=0.2.21
    - tzlocal
    - xarray

test:
  imports:
    - bluesky_tiled_plugins
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  summary: Tiled client plugins to provide an customized user experience for Bluesky data in Tiled
  home: http://blueskyproject.io
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  description: For a user wishing to connect to a running Tiled server and access Bluesky data, this package, along with its dependency tiled[client], is all they need.
  doc_url: http://blueskyproject.io/databroker
  dev_url: https://github.com/bluesky/databroker/tree/main/bluesky-tiled-plugins

extra:
  recipe-maintainers:
    - nmaytan
    - danielballan
    - mrakitin
    - genematx
