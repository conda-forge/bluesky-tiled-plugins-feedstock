{% set name = "bluesky-tiled-plugins" %}
{% set version = "2.0.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/30/e3/c9c8fb97ecf12c473f29b9b1c536163e1792f7745f1a675528df4c51c259/bluesky_tiled_plugins-{{ version }}.tar.gz
  sha256: 3354934314a86b09761cc79c9a36d355c2449c5e59cf7b067a6a4eabc2f526e2

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - dask-core
    - event-model
    - mongoquery
    - pytz
    - tiled-client >=0.2.0
    - tzlocal

test:
  imports:
    - bluesky_tiled_plugins
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  summary: Tiled client plugins to provide an customized user experience for Bluesky data in Tiled
  home: http://blueskyproject.io
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  description: For a user wishing to connect to a running Tiled server and access Bluesky data, this package, along with its dependency tiled[client], is all they need.
  doc_url: http://blueskyproject.io/databroker
  dev_url: https://github.com/bluesky/databroker/tree/main/bluesky-tiled-plugins

extra:
  recipe-maintainers:
    - nmaytan
    - danielballan
    - mrakitin
